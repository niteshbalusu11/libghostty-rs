name: windows-ci

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check libghostty-vt on Windows
        run: cargo check -p libghostty-vt --target x86_64-pc-windows-msvc
